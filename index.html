<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="ミラン研究所 夏休み探究ノート" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>ミラン研究所｜夏休み探究ノート</title>
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">MIRAN LAB</p>
      <h1>夏休み探究ノート</h1>
    </div>
    <button id="installBtn" class="ghost hidden" type="button">ホーム画面に追加</button>
  </header>

  <main>
    <section id="home" class="page active" aria-labelledby="homeTitle">
      <div class="hero card">
        <div>
          <p id="todayLabel" class="muted"></p>
          <h2 id="homeTitle">おはよう、ミラン研究員！</h2>
          <p>今日は「できた」よりも、「やってみた」を大切にしよう。</p>
        </div>
        <div class="level-box" aria-label="研究員ポイント">
          <span>研究ポイント</span>
          <strong id="pointsTotal">0</strong>
          <small id="badgeName">はじめの一歩</small>
        </div>
      </div>

      <section class="section-block">
        <div class="section-title-row">
          <h3>今日の3ミッション</h3>
          <button id="resetToday" class="text-button" type="button">今日だけリセット</button>
        </div>
        <div id="missionList" class="mission-grid"></div>
      </section>

      <section class="section-block two-col">
        <article class="card">
          <h3>今日の気分</h3>
          <div class="mood-row" id="quickMood"></div>
          <p id="moodMessage" class="muted">今の気分をひとつ選んでね。</p>
        </article>
        <article class="card">
          <h3>今日のひとこと</h3>
          <textarea id="dailyNote" rows="4" placeholder="今日やってみたいこと、気づいたこと"></textarea>
          <button id="saveDailyNote" class="primary" type="button">保存する</button>
        </article>
      </section>
    </section>

    <section id="study" class="page" aria-labelledby="studyTitle">
      <div class="section-title-row"><h2 id="studyTitle">まなびミッション</h2><span class="pill">10〜15分でOK</span></div>
      <div class="card">
        <label for="difficulty">むずかしさ</label>
        <select id="difficulty">
          <option value="easy">やさしい</option>
          <option value="normal" selected>ふつう</option>
          <option value="challenge">ちょうせん</option>
        </select>
        <div id="quizArea" class="quiz-area"></div>
        <div class="button-row">
          <button id="newQuiz" class="ghost" type="button">問題をかえる</button>
          <button id="checkQuiz" class="primary" type="button">答えあわせ</button>
        </div>
        <p id="quizResult" class="result" aria-live="polite"></p>
      </div>
    </section>

    <section id="explore" class="page" aria-labelledby="exploreTitle">
      <div class="section-title-row"><h2 id="exploreTitle">探究ノート</h2><span class="pill">写真なしでもOK</span></div>
      <form id="exploreForm" class="card form-stack">
        <label>今日のテーマ<input name="theme" required placeholder="例：セミはどこにいる？" /></label>
        <label>予想<textarea name="guess" rows="2" placeholder="こうだと思う"></textarea></label>
        <label>やってみたこと<textarea name="action" rows="3" placeholder="見た・聞いた・作ったこと"></textarea></label>
        <label>わかったこと<textarea name="found" rows="3" placeholder="発見したこと"></textarea></label>
        <label>次にためしたいこと<textarea name="next" rows="2"></textarea></label>
        <label>写真<input id="explorePhoto" name="photo" type="file" accept="image/*" capture="environment" /></label>
        <button class="primary" type="submit">研究記録を保存</button>
      </form>
      <div id="exploreEntries" class="entry-list"></div>
    </section>

    <section id="skate" class="page" aria-labelledby="skateTitle">
      <div class="section-title-row"><h2 id="skateTitle">スケボー研究室</h2><span class="pill">安全第一</span></div>
      <form id="skateForm" class="card form-stack">
        <label>今日の目標<input name="goal" required placeholder="例：まっすぐ10m進む" /></label>
        <label>練習時間（分）<input name="minutes" type="number" min="1" max="300" value="20" /></label>
        <label>できた回数<input name="success" type="number" min="0" max="999" value="0" /></label>
        <label>今日の発見<textarea name="discovery" rows="3" placeholder="体の向き、重心、スピードなど"></textarea></label>
        <button class="primary" type="submit">練習記録を保存</button>
      </form>
      <div id="skateEntries" class="entry-list"></div>
    </section>

    <section id="condition" class="page" aria-labelledby="conditionTitle">
      <div class="section-title-row"><h2 id="conditionTitle">気分と体調</h2><span class="pill">答えたくない日は休もう</span></div>
      <form id="conditionForm" class="card form-stack">
        <fieldset>
          <legend>今の気分</legend>
          <div class="choice-row" id="conditionMood"></div>
        </fieldset>
        <label>元気度 <output id="energyOutput">3</output>/5<input id="energy" name="energy" type="range" min="1" max="5" value="3" /></label>
        <label>睡眠<input name="sleep" type="number" min="0" max="15" step="0.5" placeholder="時間" /></label>
        <label>気になること<textarea name="body" rows="3" placeholder="足・お腹・頭など。何もなければ空欄でOK"></textarea></label>
        <button class="primary" type="submit">今日の記録を保存</button>
      </form>
      <div id="conditionEntries" class="entry-list"></div>
    </section>

    <section id="report" class="page" aria-labelledby="reportTitle">
      <div class="section-title-row"><h2 id="reportTitle">研究レポート</h2><span class="pill">家族といっしょに見る</span></div>
      <div class="card stats-grid" id="statsGrid"></div>
      <div class="card">
        <h3>データの保存</h3>
        <p class="muted">この端末のブラウザ内に保存されます。機種変更前にはバックアップしてください。</p>
        <div class="button-row wrap">
          <button id="exportData" class="ghost" type="button">バックアップを書き出す</button>
          <label class="file-button">バックアップを読み込む<input id="importData" type="file" accept="application/json" /></label>
          <button id="printReport" class="primary" type="button">印刷・PDF保存</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="メインメニュー">
    <button data-page="home" class="active"><span>🏠</span>ホーム</button>
    <button data-page="study"><span>✏️</span>まなび</button>
    <button data-page="explore"><span>🔎</span>探究</button>
    <button data-page="skate"><span>🛹</span>スケボー</button>
    <button data-page="condition"><span>🌱</span>体調</button>
    <button data-page="report"><span>🏅</span>記録</button>
  </nav>

  <template id="entryTemplate">
    <article class="card entry-card">
      <div class="entry-head"><strong class="entry-title"></strong><time></time></div>
      <div class="entry-body"></div>
      <button class="delete-entry text-button" type="button">削除</button>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
