<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="ミラン研究所 夏休み宿題ダッシュボード">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>ミラン研究所｜夏休み宿題ダッシュボード</title>
</head>
<body>
<header class="app-header">
  <div><p class="eyebrow">MIRAN LAB</p><h1>夏休み研究所</h1></div>
  <button id="installBtn" class="ghost hidden">ホーム画面に追加</button>
</header>

<main>
<section id="home" class="page active">
  <div class="hero card">
    <div><p id="todayLabel" class="muted"></p><h2>おはよう、ミラン研究員！</h2><p>少しずつで大丈夫。挑戦したことにポイントが入ります。</p></div>
    <div class="level-box"><span>研究ポイント</span><strong id="pointsTotal">0</strong><small id="badgeName">はじめの一歩</small></div>
  </div>

  <div class="progress-card card">
    <div class="section-title-row"><h3>夏休み宿題の達成率</h3><strong id="overallPercent">0%</strong></div>
    <div class="progress"><span id="overallBar"></span></div>
    <p id="progressMessage" class="muted"></p>
  </div>

  <section class="section-block">
    <div class="section-title-row"><h3>今日のミッション</h3><button id="resetToday" class="text-button">今日だけリセット</button></div>
    <div id="missionList" class="mission-grid"></div>
  </section>

  <section class="section-block two-col">
    <article class="card"><h3>夏の一行日記</h3><textarea id="dailyNote" rows="4" placeholder="今日あったことを一行で書こう"></textarea><button id="saveDailyNote" class="primary full">日記を保存</button></article>
    <article class="card"><h3>今日の気分</h3><div id="quickMood" class="mood-row"></div><p id="moodMessage" class="muted">今の気分を選んでね。</p></article>
  </section>
</section>

<section id="homework" class="page">
  <div class="section-title-row"><h2>学校の宿題</h2><span class="pill">芝浦小学校</span></div>
  <p class="muted">進み具合を10%ずつ増やせます。全部終わった宿題は「完了」にしてください。</p>
  <div id="homeworkList" class="homework-list"></div>
</section>

<section id="kanji" class="page">
  <div class="section-title-row"><h2>漢字研究室</h2><span class="pill">今日の5文字</span></div>
  <div class="card">
    <div id="kanjiList" class="kanji-grid"></div>
    <label>練習メモ<textarea id="kanjiMemo" rows="4" placeholder="読めた漢字、むずかしかった漢字"></textarea></label>
    <button id="finishKanji" class="primary full">5文字に挑戦した ＋10pt</button>
  </div>
</section>

<section id="math" class="page">
  <div class="section-title-row"><h2>計算研究室</h2><span class="pill">3問チャレンジ</span></div>
  <div class="card">
    <div id="quizArea" class="quiz-area"></div>
    <div class="button-row"><button id="newQuiz" class="ghost">問題をかえる</button><button id="checkQuiz" class="primary">答えあわせ</button></div>
    <p id="quizResult" class="result"></p>
  </div>
</section>

<section id="explore" class="page">
  <div class="section-title-row"><h2>理科・探究記録</h2><span class="pill">写真も保存</span></div>
  <form id="exploreForm" class="card form-stack">
    <label>見つけたもの<input name="theme" required placeholder="例：セミ、雲、花"></label>
    <label>観察したこと<textarea name="found" rows="4" placeholder="色、形、場所、気づいたこと"></textarea></label>
    <label>写真<input id="explorePhoto" type="file" accept="image/*" capture="environment"></label>
    <button class="primary">観察記録を保存 ＋8pt</button>
  </form>
  <div id="exploreEntries" class="entry-list"></div>
</section>

<section id="report" class="page">
  <div class="section-title-row"><h2>記録とバックアップ</h2><span class="pill">家族と確認</span></div>
  <div id="statsGrid" class="card stats-grid"></div>
  <div class="card">
    <h3>データを守る</h3>
    <p class="muted">更新前や機種変更前にバックアップを書き出してください。</p>
    <div class="button-row wrap">
      <button id="exportData" class="ghost">バックアップを書き出す</button>
      <label class="file-button">バックアップを読み込む<input id="importData" type="file" accept="application/json"></label>
      <button id="printReport" class="primary">印刷・PDF保存</button>
    </div>
  </div>
  <div class="card"><h3>一行日記</h3><div id="diaryEntries" class="entry-list"></div></div>
</section>
</main>

<nav class="bottom-nav">
  <button data-page="home" class="active"><span>🏠</span>ホーム</button>
  <button data-page="homework"><span>📋</span>宿題</button>
  <button data-page="kanji"><span>漢</span>漢字</button>
  <button data-page="math"><span>➕</span>計算</button>
  <button data-page="explore"><span>🔎</span>観察</button>
  <button data-page="report"><span>🏅</span>記録</button>
</nav>
<script src="app.js" defer></script>
</body></html>
